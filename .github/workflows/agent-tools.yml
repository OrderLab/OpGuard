name: Agent tool protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml libcst
      - run: python -m pytest -q tests/test_tools.py tests/test_local_sync.py tests/test_distributed_identity.py tests/test_output_dir.py tests/test_prepare_workload.py
  evidence-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python examples/independent-training-alignment/replay.py
      - run: python examples/independent-training-alignment/replay.py --harness-root ./harness
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPGUARD_TRACING_BUILD: '0'
      OPGUARD_CALLSITE_TRACER: '0'
      OPGUARD_AUTOSTART: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest
      # Default build creates the wheel from the sdist, exercising both artifacts.
      - run: python -m build
      - run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}"
      - name: Verify the installed package outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/tests/installed_smoke.py"
          opguard doctor --json
          python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests/test_runtime_policy.py" "$GITHUB_WORKSPACE/tests/test_doctor.py"
