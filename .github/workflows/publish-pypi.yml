name: Publish OpGuard to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'OrderLab/OpGuard'
    runs-on: ubuntu-latest
    env:
      OPGUARD_TRACING_BUILD: '0'
      OPGUARD_CALLSITE_TRACER: '0'
      OPGUARD_AUTOSTART: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a version tag matching package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['REF_TYPE'] != 'tag' or os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Run this workflow on the tag v{version}; branch runs cannot publish.')
          PY
      - run: python -m pip install build twine pytest
      # Build a CPU wheel FROM the sdist to validate its contents. Never upload it to PyPI.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install dist/*.whl
      - name: Verify installed distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/tests/installed_smoke.py"
          python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests/test_runtime_policy.py" "$GITHUB_WORKSPACE/tests/test_doctor.py"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opguard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-sdist
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
