name: Publish OpGuard Harness to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'OrderLab/OpGuard' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/harness-v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a harness version tag matching package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = f'harness-v{version}'
          if os.environ['REF_TYPE'] != 'tag' or os.environ['RELEASE_TAG'] != tag:
              raise SystemExit(f'Run this workflow on the tag {tag}; branch runs cannot publish.')
          PY
      - run: python -m pip install build twine uv
      # Build the universal wheel FROM the sdist; publish both distributions.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: uv tool install dist/*.whl
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
      - name: Verify the installed tool without Torch or OpGuard
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/uv-bin/opguard-harness" tools > tools.json
          "$RUNNER_TEMP/uv-tools/opguard-harness/bin/python" "$GITHUB_WORKSPACE/harness/tests/installed_smoke.py"
          "$RUNNER_TEMP/uv-tools/opguard-harness/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/harness/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-harness-dist
          path: |
            harness/dist/*.tar.gz
            harness/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opguard-harness/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-harness-dist
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
