name: Native wheel candidates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: '8.0;8.6;8.9;9.0+PTX'
      MAX_JOBS: '2'
      OPGUARD_AUTOSTART: '0'
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git build-essential
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build 'setuptools>=77.0.3' 'packaging>=24.2' wheel ninja
      # Build the sdist with isolation and no Torch. Native builds use the target Torch.
      - run: python -m build --sdist
        env:
          OPGUARD_TRACING_BUILD: '0'
          OPGUARD_CALLSITE_TRACER: '0'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip wheel --no-build-isolation --no-deps dist/opguard-*.tar.gz -w native-dist
      - run: python -m pip install native-dist/*.whl
      - name: Inspect installed candidate (CPU runner; no GPU validation)
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/tests/installed_smoke.py"
          opguard doctor --json > "$GITHUB_WORKSPACE/native-dist/doctor.json"
          python "$GITHUB_WORKSPACE/tests/check_native_wheel.py" "$GITHUB_WORKSPACE"/native-dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: opguard-linux-x86_64-py${{ matrix.python }}-torch291-cu128
          path: native-dist/
