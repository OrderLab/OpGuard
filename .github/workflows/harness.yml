name: Agent harness
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: harness
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.10', '3.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  installed-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build uv
      - run: python -m build
      - run: uv tool install dist/*.whl
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
      - name: Verify the isolated tool without Torch or OpGuard
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/uv-bin/opguard-harness" tools > tools.json
          "$RUNNER_TEMP/uv-tools/opguard-harness/bin/python" "$GITHUB_WORKSPACE/harness/tests/installed_smoke.py"
          "$RUNNER_TEMP/uv-tools/opguard-harness/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/harness/tests" -v
